[recipe]
id = "rust-sccache"
name = "sccache Shared Compilation Cache"
description = "Shared compiler cache for Rust, C, and C++"
# Regenerated by: next compile repopulates the cache.
category = "rust"
safety_level = "safe"
enabled = true
priority = 50

# On macOS sccache defaults to `~/Library/Caches/Mozilla.sccache`; the XDG
# path `~/.cache/sccache` applies when SCCACHE_DIR / XDG_CACHE_HOME is set
# (common in dotfiles), so both locations are covered. The cache is sharded
# into many small object files, so no per-entry size floor — the age gate
# keeps actively used entries out of the results.
[match]
path_glob = "~/Library/Caches/Mozilla.sccache/**"
min_age_days = 14

[[match.any_of]]
path_glob = "~/.cache/sccache/**"
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of sccache compiler cache to Trash?"

[test]
should_match = [
    "~/Library/Caches/Mozilla.sccache/0/a/blob",
    "~/.cache/sccache/9/f/object",
]
should_not_match = ["~/.cache/other/foo", "~/Library/Caches/Yarn"]
