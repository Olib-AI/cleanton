[recipe]
id = "c-cpp-ccache"
name = "ccache Compiler Cache"
description = "ccache compiler output cache (C/C++/CUDA); rebuilt automatically on the next compile"
category = "c-cpp"
icon = "fa-cogs"
safety_level = "safe"
enabled = true
priority = 75

# ccache's default cache root differs by platform: `~/Library/Caches/ccache`
# on macOS and `~/.cache/ccache` under XDG on Linux. Both are pure
# compilation output (object files + stats), regenerable from source, so the
# recipe is `safe`; the age/size floors keep an actively-used cache alone.
[match]
path_glob = "~/Library/Caches/ccache/**"
min_size_mb = 50
min_age_days = 30

[[match.any_of]]
path_glob = "~/.cache/ccache/**"
min_size_mb = 50
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of ccache output to Trash? It rebuilds on the next compile."

[test]
should_match = [
    "~/Library/Caches/ccache/myproj/obj/abc123.o",
    "~/.cache/ccache/myproj/obj/abc123.o",
]
should_not_match = [
    "~/Library/Caches/ccache2/myproj/obj/abc123.o",
    "~/Documents/ccache/myproj/obj/abc123.o",
]
