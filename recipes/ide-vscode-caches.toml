[recipe]
id = "ide-vscode-caches"
name = "VS Code Caches"
# Matches only the *Cache* subtrees. User/ (settings, keybindings, snippets)
# and globalStorage (auth/session state) never match.
description = "VS Code Cache, CachedData, Code Cache and GPUCache (regenerated on next launch)"
category = "ide"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Application Support/Code/*Cache*/**"
min_age_days = 7

[[match.any_of]]
path_glob = "~/.config/Code/*Cache*/**"
min_age_days = 7

[[match.any_of]]
path_glob = "~/Library/Application Support/Code - Insiders/*Cache*/**"
min_age_days = 7

[[match.any_of]]
path_glob = "~/.config/Code - Insiders/*Cache*/**"
min_age_days = 7

[[match.any_of]]
path_glob = "~/Library/Application Support/VSCodium/*Cache*/**"
min_age_days = 7

[[match.any_of]]
path_glob = "~/.config/VSCodium/*Cache*/**"
min_age_days = 7

[action]
type = "trash"
prompt = "Move {size} of VS Code caches to Trash?"

[test]
should_match = [
    "~/Library/Application Support/Code/CachedData/abc/extension.js",
    "~/Library/Application Support/Code/Code Cache/js/index_0",
    "~/.config/Code/CachedData/abc/extension.js",
    "~/.config/VSCodium/GPUCache/data_0",
]
should_not_match = [
    "~/Library/Application Support/Code/User/keybindings.json",
    "~/Library/Application Support/Code/User/globalStorage/state.vscdb",
    "~/.config/Code/User/keybindings.json",
]
