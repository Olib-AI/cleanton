[recipe]
id = "jvm-kotlin-konan"
name = "Kotlin/Native Toolchains"
# Regenerated by: the next Kotlin/Native build re-downloads the toolchain.
description = "Kotlin/Native toolchains and dependency cache under ~/.konan"
category = "jvm"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/.konan/**"
min_age_days = 60
min_size_mb = 100

[action]
type = "trash"
prompt = "Move {size} of Kotlin/Native toolchains to Trash?"
group = true

[test]
should_match = ["~/.konan/dependencies/apple-llvm-20200714-macos-aarch64-essentials/bin/clang"]
should_not_match = ["~/.kotlin/scripts/main.kts"]
