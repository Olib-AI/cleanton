[recipe]
id = "jvm-gradle-daemon-logs"
name = "Gradle Daemon Logs"
# Regenerated by: each daemon run writes fresh logs; old version dirs are dead.
description = "Per-version Gradle daemon logs and registry files"
category = "jvm"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.gradle/daemon/**"
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of Gradle daemon logs to Trash?"
group = true

[test]
should_match = ["~/.gradle/daemon/8.10/daemon-12345.out.log"]
should_not_match = ["~/.gradle/gradle.properties"]
