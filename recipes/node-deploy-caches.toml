[recipe]
id = "node-deploy-caches"
name = "Node Deploy Caches"
# Only .vercel is matched (one directory_name per recipe). The dir holds the
# project link (project.json) and build output; `vercel link` / the next
# deploy recreate it. Netlify/Wrangler caches would need their own recipes.
description = "Vercel .vercel deploy cache (re-created by vercel link and the next deploy)"
category = "node"
safety_level = "cautious"
enabled = true
priority = 50

[match]
directory_name = ".vercel"
parent_must_contain = ["package.json"]

[action]
type = "trash"
prompt = "Move {size} of Vercel deploy caches to Trash?"

[test]
should_match = ["projects/app/.vercel"]
should_not_match = ["projects/app/src", "loose/.vercel"]
