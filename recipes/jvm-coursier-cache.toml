[recipe]
id = "jvm-coursier-cache"
name = "Coursier Cache"
description = "Coursier artifact cache used by Scala and sbt (re-downloaded on demand)"
category = "jvm"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/Coursier/**"
min_age_days = 30

# Linux (XDG): coursier's cache under XDG_CACHE_HOME.
[[match.any_of]]
min_age_days = 30
path_glob = "~/.cache/coursier/**"

[action]
type = "trash"
prompt = "Move {size} of Coursier cache to Trash?"

[test]
should_match = [
    "~/Library/Caches/Coursier/v1/https/repo1.maven.org/maven2/org/scala-lang/scala-library.jar",
    "~/.cache/coursier/v1/https/example.com/foo.jar",
]
should_not_match = [
    "~/Library/Caches/Yarn",
    "~/Library/Application Support/Coursier/credentials.properties",
    "~/.cache/other/foo",
]
