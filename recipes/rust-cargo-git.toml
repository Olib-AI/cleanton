[recipe]
id = "rust-cargo-git"
name = "Cargo Git Dependency Checkouts"
description = "Git dependency checkouts for Cargo"
category = "rust"
safety_level = "safe"
enabled = true
priority = 50

# Regenerated by: cargo re-checks-out from the bare clones in `git/db` (or
# re-fetches) on the next build that needs them.
[match]
path_glob = "~/.cargo/git/checkouts/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Cargo git checkouts to Trash?"
group = true

[test]
should_match = ["~/.cargo/git/checkouts/serde-1a2b3c/0f1e2d"]
should_not_match = ["~/.cargo/registry", "~/.cargo/git/db/serde-1a2b3c"]
