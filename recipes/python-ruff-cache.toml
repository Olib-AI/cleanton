[recipe]
id = "python-ruff-cache"
name = "Ruff Cache"
description = "Ruff linter/formatter cache (rebuilt on the next ruff run)"
# Regenerated by: ruff recreates .ruff_cache / ~/.cache/ruff automatically.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cache/ruff/**"
min_age_days = 14

[[match.any_of]]
directory_name = ".ruff_cache"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "ruff.toml", ".ruff.toml"]

[action]
type = "trash"
prompt = "Move {size} of Ruff cache to Trash?"

[test]
should_match = ["~/.cache/ruff/0.1.0/123456", "projects/app/.ruff_cache"]
should_not_match = ["~/.cache/other/foo", "loose/.ruff_cache"]
