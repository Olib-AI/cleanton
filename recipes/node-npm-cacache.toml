[recipe]
id = "node-npm-cacache"
name = "npm Content Cache"
# Regenerated by: npm re-downloads tarballs on the next install. ~/.npmrc
# (auth tokens) is protected and never matched.
description = "npm content-addressable download cache (re-fetched on demand)"
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.npm/_cacache/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of npm cache to Trash?"

[test]
should_match = ["~/.npm/_cacache/content-v2/sha512/aa/bb/ccdd"]
should_not_match = ["~/.npm/_logs/2026-01-01T00_00_00_000Z-debug-0.log"]
