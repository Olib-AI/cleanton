[recipe]
id = "python-poetry-cache"
name = "Poetry Cache"
description = "Poetry dependency download cache"
# Regenerated by: poetry install re-downloads artifacts on demand.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/pypoetry/**"
min_size_mb = 50

[action]
type = "trash"
prompt = "Move {size} of Poetry cache to Trash?"
group = true

[test]
should_match = ["~/Library/Caches/pypoetry/artifacts/foo"]
should_not_match = ["~/Library/Caches/Homebrew"]
