[recipe]
id = "python-poetry-cache"
name = "Poetry Cache"
description = "Poetry dependency download cache"
# Regenerated by: poetry install re-downloads artifacts on demand.
# Poetry keeps project virtualenvs under this same cache dir on macOS;
# trashing those would break every active poetry project, so virtualenvs/ is
# excluded and only the download caches (artifacts/, cache/, src/) match.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/pypoetry/**"
min_size_mb = 50

[match.exclude]
paths = ["~/Library/Caches/pypoetry/virtualenvs", "~/Library/Caches/pypoetry/virtualenvs/**"]

# Linux (XDG): Poetry's cache lives in ~/.cache/pypoetry.
[[match.any_of]]
min_size_mb = 50
path_glob = "~/.cache/pypoetry/**"

[action]
type = "trash"
prompt = "Move {size} of Poetry cache to Trash?"

[test]
should_match = [
    "~/Library/Caches/pypoetry/artifacts/foo",
    "~/.cache/pypoetry/artifacts/foo",
]
should_not_match = [
    "~/Library/Caches/Homebrew",
    "~/Library/Caches/pypoetry/virtualenvs/api-abc123-py3.12/bin/python",
    "~/.cache/other/foo",
]
