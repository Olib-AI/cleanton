[recipe]
id = "haskell-stack-work"
name = "Haskell Stack Work Dirs"
description = ".stack-work build outputs (rebuilt by the next stack build)"
category = "haskell"
safety_level = "safe"
enabled = true
priority = 50

[match]
directory_name = ".stack-work"
# stack.yaml sits at the project root; subpackages of a multi-package stack
# project carry package.yaml (hpack) instead. Either proves the dir is Stack's.
parent_must_contain_any = ["stack.yaml", "package.yaml"]

[action]
type = "trash"
prompt = "Move {size} of Stack work directories to Trash?"

[test]
should_match = ["projects/hs-app/.stack-work", "projects/hs-monorepo/subpkg/.stack-work"]
should_not_match = ["loose/.stack-work", "projects/hs-app/src"]
