[recipe]
id = "python-precommit-cache"
name = "pre-commit Cache"
description = "pre-commit hook environments (re-cloned and rebuilt on the next run)"
# Regenerated by: pre-commit re-creates ~/.cache/pre-commit on demand.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cache/pre-commit/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of pre-commit cache to Trash?"

[test]
should_match = ["~/.cache/pre-commit/repo123/py_env/bin/python"]
should_not_match = ["~/.cache/other/foo", "~/.config/pre-commit/config.yaml"]
