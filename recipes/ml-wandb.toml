[recipe]
id = "ml-wandb"
name = "Weights & Biases Local Data"
description = "Local run data for Weights & Biases"
category = "ml"
safety_level = "cautious"
enabled = true
priority = 50

# Prefer the tool's own footprint as proof: every W&B run leaves a
# `latest-run` link inside the `wandb` dir. Fall back to a training-script
# sibling for freshly-initialized dirs that have not run yet.
[match]
directory_name = "wandb"
self_must_contain = ["latest-run"]
min_age_days = 7

[[match.any_of]]
directory_name = "wandb"
parent_must_contain_any = ["train.py", "train.ipynb"]
min_age_days = 7

[action]
type = "trash"
prompt = "Move {size} of W&B logs to Trash?"

[test]
should_match = ["projects/ml/wandb"]
should_not_match = ["projects/ml/src", "loose/wandb"]
