[recipe]
id = "ide-zed-cache"
name = "Zed Caches"
description = "Zed editor caches (regenerated on next launch)"
category = "ide"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/dev.zed.Zed*/**"
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of Zed caches to Trash?"

[test]
should_match = ["~/Library/Caches/dev.zed.Zed/embeddings/model.bin"]
should_not_match = ["~/.config/zed/keymap.json"]
