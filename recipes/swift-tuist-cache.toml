[recipe]
id = "swift-tuist-cache"
name = "Tuist Cache"
description = "Tuist binary and project-generation caches (rebuilt by tuist)"
category = "swift"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/tuist/**"
min_age_days = 30

# Linux (XDG): Tuist's cache directory.
[[match.any_of]]
min_age_days = 30
path_glob = "~/.cache/tuist/**"

[action]
type = "trash"
prompt = "Move {size} of Tuist cache to Trash?"

[test]
should_match = [
    "~/Library/Caches/tuist/BinaryCache/MyFramework.xcframework-payload",
    "~/.cache/tuist/PROJECT/foo",
]
should_not_match = [
    "~/Library/Caches/Yarn",
    "~/.cache/other/foo",
]
