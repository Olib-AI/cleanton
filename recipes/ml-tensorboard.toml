[recipe]
id = "ml-tensorboard"
name = "TensorBoard Log Directories"
description = "TensorBoard logs directory"
category = "ml"
safety_level = "cautious"
enabled = true
priority = 50

# A `runs` directory is TensorBoard's conventional logdir, but the name is
# generic — require a training script sibling as proof before offering it.
[match]
directory_name = "runs"
parent_must_contain_any = ["train.py", "train.ipynb"]
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of TensorBoard logs to Trash?"

[test]
should_match = ["projects/ml/runs"]
should_not_match = ["projects/ml/src", "loose/runs"]
