[recipe]
id = "node-yarn-berry-cache"
name = "Yarn Berry Cache"
# Only the cache/ subtree. The rest of .yarn (releases/, plugins/, patches/,
# sdks/) is often committed and required to run the project at all -- trashing
# the whole .yarn dir breaks zero-install and pinned-release setups.
description = "Yarn Berry package cache (re-fetched by yarn install)"
category = "node"
safety_level = "cautious"
enabled = true
priority = 50

[match]
directory_name = "cache"
path_glob = "**/.yarn/cache"

[action]
type = "trash"
prompt = "Move {size} of Yarn Berry cache to Trash?"

[test]
should_match = ["projects/app/.yarn/cache"]
should_not_match = ["projects/app/.yarn/releases", "projects/app/.yarn", "loose/cache"]
