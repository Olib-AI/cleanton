[recipe]
id = "cmake-build-dirs"
name = "CMake Build Directories"
# self_must_contain proves the directory really is a CMake build tree; a
# directory merely named build never matches without CMakeCache.txt inside.
description = "CMake build trees, proven by CMakeCache.txt inside (regenerated by cmake)"
category = "c-cpp"
safety_level = "cautious"
enabled = true
priority = 50

[match]
directory_name = "build"
self_must_contain = ["CMakeCache.txt"]
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of CMake build directories to Trash?"

[test]
should_match = ["projects/native-lib/build"]
should_not_match = ["loose/build", "projects/native-lib/src"]
