[recipe]
id = "rust-cargo-registry-src"
name = "Cargo Registry Source Checkouts"
description = "Extracted Cargo registry source code checkouts"
# Regenerated by: cargo re-extracts sources from the .crate cache on demand.
category = "rust"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cargo/registry/src/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Cargo registry source checkouts to Trash?"
group = true

[test]
should_match = ["~/.cargo/registry/src/index.crates.io-6f17d22bba15001f/serde-1.0.200/src/lib.rs"]
should_not_match = ["~/.cargo/registry/cache/foo.crate", "~/.cargo/bin/cargo-nextest"]
