[recipe]
id = "node-bundler-caches"
name = "Node Bundler Caches"
# Each tool owns one subdirectory of node_modules/.cache and rebuilds it on
# the next run. The parent_must_contain marker keeps the glob inside real
# Node projects, so a stray .cache directory never matches.
description = "Per-project babel-loader, SWC, Nx and Storybook caches under node_modules/.cache"
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "**/node_modules/.cache/babel-loader/**"
parent_must_contain = ["package.json"]

# SWC: the Rust compiler's per-project cache.
[[match.any_of]]
path_glob = "**/node_modules/.cache/swc/**"
parent_must_contain = ["package.json"]

# Nx: the monorepo task cache.
[[match.any_of]]
path_glob = "**/node_modules/.cache/nx/**"
parent_must_contain = ["package.json"]

# Storybook: the built-storybook cache.
[[match.any_of]]
path_glob = "**/node_modules/.cache/storybook/**"
parent_must_contain = ["package.json"]

[action]
type = "trash"
prompt = "Move {size} of Node bundler caches to Trash?"

[test]
should_match = [
    "projects/app/node_modules/.cache/babel-loader/abc.json",
    "projects/app/node_modules/.cache/swc/abc",
    "projects/app/node_modules/.cache/nx/abc",
    "projects/app/node_modules/.cache/storybook/abc",
]
should_not_match = [
    "projects/app/node_modules/.cache/other/abc",
    "projects/app/.cache/babel-loader/abc",
    "loose/node_modules/.cache/babel-loader/abc",
]
