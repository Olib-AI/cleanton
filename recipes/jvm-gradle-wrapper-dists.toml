[recipe]
id = "jvm-gradle-wrapper-dists"
name = "Gradle Wrapper Distributions"
# Regenerated by: ./gradlew re-downloads the distribution named in
# gradle-wrapper.properties on the next invocation.
description = "Downloaded Gradle wrapper distributions (re-downloaded on next ./gradlew run)"
category = "jvm"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.gradle/wrapper/dists/**"
min_age_days = 60

[action]
type = "trash"
prompt = "Move {size} of Gradle wrapper distributions to Trash?"
group = true

[test]
should_match = ["~/.gradle/wrapper/dists/gradle-8.10-bin/abc123/gradle-8.10-bin.zip"]
should_not_match = ["~/.gradle/gradle.properties"]
