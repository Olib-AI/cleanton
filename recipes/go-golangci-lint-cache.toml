[recipe]
id = "go-golangci-lint-cache"
name = "golangci-lint Cache"
description = "golangci-lint analysis cache (rebuilt on the next lint run)"
category = "go"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/golangci-lint/**"
min_age_days = 14

# Linux (XDG): XDG_CACHE_HOME/golangci-lint.
[[match.any_of]]
min_age_days = 14
path_glob = "~/.cache/golangci-lint/**"

[action]
type = "trash"
prompt = "Move {size} of golangci-lint cache to Trash?"

[test]
should_match = [
    "~/Library/Caches/golangci-lint/abc123/analysis.bin",
    "~/.cache/golangci-lint/tmp/abc",
]
should_not_match = [
    "~/Library/Caches/Yarn",
    "~/.cache/golangci-lint-other/x",
]
