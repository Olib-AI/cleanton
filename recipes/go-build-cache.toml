[recipe]
id = "go-build-cache"
name = "Go Build Cache"
description = "Go build cache (GOCACHE default, rebuilt by the next go build)"
category = "go"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/go-build/**"

[action]
type = "trash"
prompt = "Move {size} of Go build cache to Trash?"

[test]
should_match = ["~/Library/Caches/go-build/00/0000000000000000000000000000000000000000-d"]
should_not_match = ["~/Library/Caches/Yarn", "~/go/bin/gopls"]
