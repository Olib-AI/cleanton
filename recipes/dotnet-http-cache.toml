[recipe]
id = "dotnet-http-cache"
name = "NuGet HTTP Metadata Cache"
description = "NuGet HTTP and v3 feed response caches on macOS and Linux (re-fetched on restore)"
category = "dotnet"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.local/share/NuGet/http-cache/**"
min_age_days = 30

[[match.any_of]]
path_glob = "~/.local/share/NuGet/v3-cache/**"
min_age_days = 30

[[match.any_of]]
path_glob = "~/Library/Caches/NuGet/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of NuGet HTTP cache to Trash?"

[test]
should_match = [
    "~/.local/share/NuGet/http-cache/abc123/index.dat",
    "~/.local/share/NuGet/v3-cache/api.nuget.org/index.json",
    "~/Library/Caches/NuGet/http-cache/abc123/index.dat",
]
should_not_match = ["~/.nuget/NuGet/NuGet.Config", "~/.local/share/other/index.dat"]
