[recipe]
id = "node-corepack-cache"
name = "Corepack Cache"
description = "Corepack-downloaded package managers (re-downloaded on demand)"
# Regenerated by: corepack re-downloads pnpm/yarn shims when next invoked.
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cache/node/corepack/**"
min_age_days = 30

[[match.any_of]]
path_glob = "~/Library/Caches/node/corepack/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Corepack cache to Trash?"

[test]
should_match = ["~/.cache/node/corepack/v1/pnpm/9.0.0/bin/pnpm.cjs", "~/Library/Caches/node/corepack/v1/yarn/4.0.0/bin/yarn.js"]
should_not_match = ["~/.cache/node/other/foo"]
