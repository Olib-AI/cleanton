[recipe]
id = "node-bun-cache"
name = "Bun Install Cache"
description = "Global package install cache for Bun"
# Regenerated by: bun install (re-downloads packages on demand).
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.bun/install/cache/**"

[action]
type = "trash"
prompt = "Move {size} of Bun install cache to Trash?"
group = true

[test]
should_match = ["~/.bun/install/cache/foo/package.json"]
should_not_match = ["~/.bun/bin", "~/.bun/install/global/node_modules/typescript/package.json"]
