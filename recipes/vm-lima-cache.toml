[recipe]
id = "vm-lima-cache"
name = "Lima / Colima Image Cache"
# Only the download cache; live VM disks live under ~/.lima / ~/.colima and
# are never matched.
description = "Lima downloaded VM images used by lima and colima (re-downloaded on demand)"
category = "vm"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/lima/**"
min_age_days = 30
min_size_mb = 100

[action]
type = "trash"
prompt = "Move {size} of Lima image cache to Trash?"
group = true

[test]
should_match = ["~/Library/Caches/lima/download/by-url-sha256/abc123/data"]
should_not_match = ["~/.lima/default/lima.yaml"]
