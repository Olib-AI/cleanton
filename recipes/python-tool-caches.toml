[recipe]
id = "python-tool-caches"
name = "Python Tool Caches"
description = "Per-project mypy, pytest, hypothesis, tox, nox and pytype caches"
# Regenerated by: next test, lint, or type-check run rebuilds these caches.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
directory_name = ".mypy_cache"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg", "mypy.ini", "requirements.txt"]

[[match.any_of]]
directory_name = ".pytest_cache"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg", "pytest.ini", "requirements.txt", "conftest.py"]

[[match.any_of]]
directory_name = ".hypothesis"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg", "pytest.ini", "requirements.txt"]

[[match.any_of]]
directory_name = ".tox"
parent_must_contain_any = ["tox.ini", "pyproject.toml"]
min_age_days = 14

[[match.any_of]]
directory_name = ".nox"
parent_must_contain_any = ["noxfile.py", "pyproject.toml"]
min_age_days = 14

[[match.any_of]]
directory_name = ".pytype"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg"]

[action]
type = "trash"
prompt = "Move {size} of Python tool caches to Trash?"

[test]
should_match = [
    "projects/app/.mypy_cache",
    "projects/app/.pytest_cache",
    "projects/app/.tox",
    "projects/app/.nox",
]
should_not_match = ["projects/app/src", "loose/.mypy_cache", "loose/.pytest_cache"]
