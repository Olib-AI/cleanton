[recipe]
id = "python-tool-caches"
name = "Python Tool Caches"
description = "mypy type-check cache"
# Regenerated by: next mypy run rebuilds the cache.
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
directory_name = ".mypy_cache"
parent_must_contain_any = ["pyproject.toml", "setup.py", "setup.cfg", "mypy.ini", "requirements.txt"]

[action]
type = "trash"
prompt = "Move {size} of Python tool caches to Trash?"

[test]
should_match = ["projects/app/.mypy_cache"]
should_not_match = ["projects/app/src", "loose/.mypy_cache"]
