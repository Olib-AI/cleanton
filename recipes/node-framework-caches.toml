[recipe]
id = "node-framework-caches"
name = "Node Framework Caches"
# Vite's dependency-optimizer cache lives at node_modules/.vite (the previous
# package.json parent guard could never hold there, so the recipe was dead).
# Custom cacheDir locations, and Astro/SvelteKit/Nuxt caches (.astro,
# .svelte-kit, .nuxt), would need their own recipes.
description = "Vite cache under node_modules/.vite (rebuilt by the next dev/build run)"
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
directory_name = ".vite"
path_glob = "**/node_modules/.vite"

[action]
type = "trash"
prompt = "Move {size} of framework caches to Trash?"
group = true

[test]
should_match = ["projects/app/node_modules/.vite"]
should_not_match = ["projects/app/.vitepress", "loose/.vite"]
