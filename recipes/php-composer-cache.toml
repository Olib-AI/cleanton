[recipe]
id = "php-composer-cache"
name = "Composer Cache"
# Regenerated by: composer re-downloads packages on the next install/update.
# Composer 2.3+ on macOS caches under ~/Library/Caches/composer; the legacy
# ~/.composer/cache location is not covered (one glob per recipe). auth.json
# lives in the composer config dir and is refused by the sensitive-basename
# floor regardless.
description = "PHP Composer package download cache (re-downloaded on demand)"
category = "php"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/composer/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Composer cache to Trash?"
group = true

[test]
should_match = ["~/Library/Caches/composer/files/vendor/package/1.0.0.zip"]
should_not_match = ["~/.composer/composer.json", "~/.composer/auth.json"]
