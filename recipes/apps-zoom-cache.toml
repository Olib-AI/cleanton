[recipe]
id = "apps-zoom-cache"
name = "Zoom Cache"
# Local meeting recordings live in ~/Documents/Zoom, a protected user-data
# root the matcher floor refuses outright (protected fixtures are not even
# allowed in tests); only the app's regenerable cache is targeted here.
description = "Zoom application cache (re-created while the app runs)"
category = "apps"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/us.zoom.xos/**"
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of Zoom cache to Trash?"
group = true

[test]
should_match = ["~/Library/Caches/us.zoom.xos/Cache.db"]
should_not_match = ["~/Library/Application Support/zoom.us/data/zoomus.db", "~/Library/Caches/us.zoom.videomeetings.plist"]
