[recipe]
id = "browser-edge-http-cache"
name = "Edge HTTP Cache"
# Matches only the per-profile Cache/Cache_Data subtree (Default, Profile 1,
# ...) that Edge rebuilds while browsing. Profile databases (History,
# Bookmarks, Login Data, Cookies) are sibling files and never match.
description = "Microsoft Edge per-profile HTTP disk cache (rebuilt while browsing)"
category = "apps"
safety_level = "cautious"
enabled = true
priority = 55

[match]
path_glob = "~/Library/Application Support/Microsoft Edge/*/Cache/Cache_Data/**"
min_age_days = 7

# Linux (XDG): Edge keeps its profile in ~/.config.
[[match.any_of]]
path_glob = "~/.config/microsoft-edge/*/Cache/Cache_Data/**"
min_age_days = 7

[action]
type = "trash"
prompt = "Move {size} of Edge HTTP cache to Trash?"

[test]
should_match = [
    "~/Library/Application Support/Microsoft Edge/Default/Cache/Cache_Data/f_000001",
    "~/.config/microsoft-edge/Default/Cache/Cache_Data/f_000002",
]
should_not_match = [
    "~/Library/Application Support/Microsoft Edge/Default/History",
    "~/.config/microsoft-edge/Default/Bookmarks",
    "~/.config/microsoft-edge/Default/Login Data",
]
