[recipe]
id = "rust-cargo-registry-cache"
name = "Cargo Registry Cache"
description = "Downloaded Cargo .crate files"
# Regenerated by: cargo re-downloads .crate files on demand.
category = "rust"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cargo/registry/cache/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Cargo registry cache to Trash?"

[test]
should_match = ["~/.cargo/registry/cache/index.crates.io-6f17d22bba15001f/serde-1.0.200.crate"]
should_not_match = ["~/.cargo/registry/src/foo", "~/.cargo/registry/index/index.crates.io-6f17d22bba15001f"]
