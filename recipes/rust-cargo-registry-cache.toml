[recipe]
id = "rust-cargo-registry-cache"
name = "Cargo Registry Cache"
description = "Downloaded Cargo .crate files"
# Regenerated by: cargo re-downloads .crate files on demand.
category = "rust"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cargo/registry/cache/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Cargo registry cache to Trash?"
group = true

[test]
should_match = ["~/.cargo/registry/cache/foo.crate"]
should_not_match = ["~/.cargo/registry/src/foo"]
