[recipe]
id = "ruby-gem-cache"
name = "RubyGems Cache"
description = "Downloaded .gem archives kept by RubyGems (re-fetched by gem install)"
category = "ruby"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.gem/ruby/*/cache/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of RubyGems cache to Trash?"

[test]
should_match = ["~/.gem/ruby/3.3.0/cache/rails-7.1.3.gem"]
should_not_match = ["~/.gem/credentials", "~/.gem/ruby/3.3.0/gems/rails-7.1.3/lib/rails.rb"]
