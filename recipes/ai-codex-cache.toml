[recipe]
id = "ai-codex-cache"
name = "Codex CLI Cache"
# Only the dedicated log subtree of $CODEX_HOME (~/.codex/log, e.g.
# codex-tui.log). auth.json, config.toml, sessions/, and history.jsonl live
# directly under ~/.codex and are never matched. Auth/config basenames are
# also excluded as defense-in-depth.
description = "OpenAI Codex CLI logs (never ~/.codex auth/config/sessions/history)"
category = "ai-tools"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/.codex/log/**"
min_age_days = 14

[match.exclude]
names = ["auth.json", "config.toml", "config.json", ".credentials.json", "credentials.json"]

[action]
type = "trash"
prompt = "Move {size} of Codex CLI logs to Trash?"
group = true

[test]
should_match = ["~/.codex/log/codex-tui.log"]
should_not_match = ["~/.codex/auth.json", "~/.codex/config.toml", "~/.codex/sessions/2026/rollout.jsonl", "~/.codex/history.jsonl"]
