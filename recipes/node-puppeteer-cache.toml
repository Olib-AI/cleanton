[recipe]
id = "node-puppeteer-cache"
name = "Puppeteer Browsers"
description = "Puppeteer downloaded browser builds (re-downloaded on next install)"
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cache/puppeteer/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Puppeteer browsers to Trash?"
group = true

[test]
should_match = ["~/.cache/puppeteer/chrome/mac_arm-127.0.6533.88/chrome-mac-arm64/payload.bin"]
should_not_match = ["~/.cache/other"]
