[recipe]
id = "apps-slack-cache"
name = "Slack Cache"
description = "Slack desktop app HTTP/media cache; re-fetched from Slack on demand"
category = "apps"
icon = "fa-comments"
safety_level = "cautious"
enabled = true
priority = 50

# Slack for Mac keys its caches off the bundle id
# (`com.tinyspeck.slackmacgap`). Media/HTTP caches are regenerable, but Slack
# can be mid-conversation, so this is `cautious` with an age gate. The
# matcher's safety floors still refuse credentials and protected paths.
[match]
path_glob = "~/Library/Caches/com.tinyspeck.slackmacgap/**"
min_age_days = 14

# Linux: Slack keeps the Chromium cache in its config dir.
[[match.any_of]]
min_age_days = 14
path_glob = "~/.config/Slack/Cache/**"

[action]
type = "trash"
prompt = "Move {size} of Slack cache to Trash? Slack re-fetches it on demand."

[test]
should_match = [
    "~/Library/Caches/com.tinyspeck.slackmacgap/Cache/CacheData/abc",
    "~/.config/Slack/Cache/foo",
]
should_not_match = [
    "~/Library/Caches/com.tinyspeck.slackmacgapx/Cache/CacheData/abc",
    "~/projects/Slack/Cache/CacheData/abc",
    "~/.config/Slack/storage/slack-teams",
]
