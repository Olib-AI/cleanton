[recipe]
id = "node-next-cache"
name = "Next.js Build Cache"
# .next holds the build `next start` serves from, not just a cache; the age
# gate skips any app built (or served) in the last two weeks.
description = "Next.js .next build output and cache (rebuilt by the next build)"
category = "node"
safety_level = "cautious"
enabled = true
priority = 50

[match]
directory_name = ".next"
parent_must_contain = ["package.json"]
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of Next.js cache to Trash?"

[test]
should_match = ["projects/app/.next"]
should_not_match = ["projects/app/src", "loose/.next"]
