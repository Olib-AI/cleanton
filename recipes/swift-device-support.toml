[recipe]
id = "swift-device-support"
name = "Xcode Device Support Files"
description = "Xcode support files for iOS/watchOS devices"
# Regenerated by: Xcode re-creates device support on next device connect/debug.
category = "swift"
safety_level = "safe"
enabled = true
priority = 50

# Xcode keeps one symbol tree per connected device OS version; watchOS and
# tvOS have sibling directories with the same layout.
[match]
path_glob = "~/Library/Developer/Xcode/iOS DeviceSupport/**"
min_age_days = 180

[[match.any_of]]
path_glob = "~/Library/Developer/Xcode/watchOS DeviceSupport/**"
min_age_days = 180

[[match.any_of]]
path_glob = "~/Library/Developer/Xcode/tvOS DeviceSupport/**"
min_age_days = 180

[action]
type = "trash"
prompt = "Move {size} of Xcode Device Support files to Trash?"

[test]
should_match = [
    "~/Library/Developer/Xcode/iOS DeviceSupport/iPhone14,2 17.5.1/Symbols",
    "~/Library/Developer/Xcode/watchOS DeviceSupport/Watch6,9 10.2/Symbols",
    "~/Library/Developer/Xcode/tvOS DeviceSupport/AppleTV11,1 17.0/Symbols",
]
should_not_match = ["~/Library/Developer/Xcode/DerivedData"]
