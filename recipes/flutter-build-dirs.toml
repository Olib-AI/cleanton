[recipe]
id = "flutter-build-dirs"
name = "Flutter Build Outputs"
description = "build/ outputs of Flutter and Dart projects (rebuilt by the next build)"
category = "dart"
safety_level = "cautious"
enabled = true
priority = 50

[match]
directory_name = "build"
parent_must_contain = ["pubspec.yaml"]
min_age_days = 14

[action]
type = "trash"
prompt = "Move {size} of Flutter build outputs to Trash?"
group = true

[test]
should_match = ["projects/my-flutter-app/build"]
should_not_match = ["loose/build", "projects/my-flutter-app/lib"]
