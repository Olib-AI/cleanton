[recipe]
id = "jvm-gradle-caches"
name = "Gradle Caches"
# Regenerated by: the next Gradle build re-resolves dependencies and rebuilds
# the build cache. gradle.properties (which can hold signing credentials) and
# init scripts live outside caches/ and are never matched.
description = "Gradle dependency and build caches (re-downloaded and rebuilt on demand)"
category = "jvm"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/.gradle/caches/**"
min_age_days = 30
min_size_mb = 10

[action]
type = "trash"
prompt = "Move {size} of Gradle caches to Trash?"

[test]
should_match = ["~/.gradle/caches/modules-2/files-2.1/org.example/lib/1.0/lib-1.0.jar"]
should_not_match = ["~/.gradle/gradle.properties", "~/.gradle/init.d/setup.gradle"]
