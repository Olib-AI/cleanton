[recipe]
id = "node-electron-caches"
name = "Electron Build Caches"
description = "electron and electron-builder download caches (re-downloaded on demand)"
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/electron*/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of Electron build caches to Trash?"
group = true

[test]
should_match = ["~/Library/Caches/electron/electron-v31.0.0-darwin-arm64.zip", "~/Library/Caches/electron-builder/nsis/nsis-3.0.4.1.7z"]
should_not_match = ["~/Library/Caches/Yarn"]
