[recipe]
id = "android-studio-caches"
name = "Android Studio Caches"
# Only ~/Library/Caches; settings, keymaps, and AVDs live elsewhere and are
# never matched.
description = "Android Studio per-version system caches (rebuilt by the IDE on next launch)"
category = "android"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/Google/AndroidStudio*/**"
min_age_days = 14

# Linux (XDG): Android Studio caches under XDG_CACHE_HOME.
[[match.any_of]]
min_age_days = 14
path_glob = "~/.cache/Google/AndroidStudio*/**"

[action]
type = "trash"
prompt = "Move {size} of Android Studio caches to Trash?"

[test]
should_match = [
    "~/Library/Caches/Google/AndroidStudio2025.1/caches/content.dat.storageData",
    "~/.cache/Google/AndroidStudio2024.1/tmp/foo",
]
should_not_match = [
    "~/Library/Application Support/Google/AndroidStudio2025.1/options/ide.general.xml",
    "~/.cache/Google/other/foo",
]
