[recipe]
id = "python-pip-cache"
name = "pip Cache"
description = "Global pip HTTP and wheel cache"
# Regenerated by: pip re-downloads wheels on demand (equivalent of pip cache purge).
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Caches/pip/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of pip wheel/http cache to Trash?"

[test]
should_match = ["~/Library/Caches/pip/wheels/foo"]
should_not_match = ["~/Library/Caches/Homebrew"]
