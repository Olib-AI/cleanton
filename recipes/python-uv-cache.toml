[recipe]
id = "python-uv-cache"
name = "uv Cache"
description = "Package resolution and download cache for uv"
# Regenerated by: uv re-downloads/re-resolves on demand (equivalent of uv cache clean).
category = "python"
safety_level = "safe"
enabled = true
priority = 50

[match]
path_glob = "~/.cache/uv/**"
min_size_mb = 100

[action]
type = "trash"
prompt = "Move {size} of uv cache to Trash?"

[test]
should_match = ["~/.cache/uv/archive/foo"]
should_not_match = ["~/.cache/other", "~/.local/share/uv/python/cpython-3.12.6-macos-aarch64-none/bin/python3"]
