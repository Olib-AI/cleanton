[recipe]
id = "apple-saved-application-state"
name = "Saved Application State"
# Only cost: apps reopen without their saved window layout. macOS re-creates
# each .savedState bundle the next time the app quits.
description = "Per-app window restoration state (rebuilt by macOS when each app quits)"
category = "system"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/Library/Saved Application State/*.savedState/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of saved application state to Trash?"
group = true

[test]
should_match = ["~/Library/Saved Application State/com.apple.Safari.savedState/windows.plist"]
should_not_match = ["~/Library/Saved Application State/notes.txt", "~/Library/Application Support/Safari/LastSession.plist"]
