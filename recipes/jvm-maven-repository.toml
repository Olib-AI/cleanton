[recipe]
id = "jvm-maven-repository"
name = "Maven Local Repository"
# Regenerated by: the next mvn build re-fetches needed artifacts.
# settings.xml (which can hold server credentials) is outside repository/.
description = "Maven local artifact repository (re-downloaded from configured repositories)"
category = "jvm"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/.m2/repository/**"
min_age_days = 60
min_size_mb = 50

[action]
type = "trash"
prompt = "Move {size} of Maven local repository to Trash?"
group = true

[test]
should_match = ["~/.m2/repository/org/example/lib/1.0/lib-1.0.jar"]
should_not_match = ["~/.m2/settings.xml"]
