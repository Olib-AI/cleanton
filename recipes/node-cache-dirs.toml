[recipe]
id = "node-cache-dirs"
name = "Node Tool Caches"
description = "Parcel bundler cache"
# Regenerated by: next parcel/build run rebuilds the cache.
category = "node"
safety_level = "safe"
enabled = true
priority = 50

[match]
directory_name = ".parcel-cache"
parent_must_contain = ["package.json"]

[action]
type = "trash"
prompt = "Move {size} of Node tool caches to Trash?"
group = true

[test]
should_match = ["projects/app/.parcel-cache"]
should_not_match = ["projects/app/src", "loose/.parcel-cache"]
