[recipe]
id = "ml-datasets-cache"
name = "Cached Datasets"
description = "Hugging Face and PyTorch cached datasets"
category = "ml"
safety_level = "cautious"
enabled = true
priority = 50

# Datasets cached by the `datasets` library under the default HF home
# (`~/.cache/huggingface/datasets`); re-downloaded/rebuilt on next use. The hub
# model cache and the auth token live in sibling directories and are NOT
# touched by this glob.
[match]
path_glob = "~/.cache/huggingface/datasets/**"
min_age_days = 30

[action]
type = "trash"
prompt = "Move {size} of HF datasets cache to Trash?"
group = true

[test]
should_match = [
    "~/.cache/huggingface/datasets/imdb/plain_text/cache.arrow",
    "~/.cache/huggingface/datasets/downloads/abc123.lock",
]
should_not_match = [
    "~/.cache/other",
    "~/.cache/huggingface/hub/models--BAAI--bge-small-en-v1.5",
    "~/.cache/huggingface/token",
]
