[recipe]
id = "node-pnpm-store"
name = "pnpm Global Store"
# Only store/; globally installed packages live under ~/Library/pnpm/global
# and are never matched. Existing node_modules keep their hardlinked content;
# the next pnpm install re-fetches whatever is missing.
description = "Global pnpm content-addressable store (re-fetched by pnpm install)"
category = "node"
safety_level = "cautious"
enabled = true
priority = 50

[match]
path_glob = "~/Library/pnpm/store/**"
min_size_mb = 100

[[match.any_of]]
path_glob = "~/.local/share/pnpm/store/**"
min_size_mb = 100

[[match.any_of]]
path_glob = "~/.pnpm-store/**"
min_size_mb = 100

[action]
type = "trash"
prompt = "Move {size} of pnpm global store to Trash?"

[test]
should_match = ["~/Library/pnpm/store/v3/files/foo", "~/.local/share/pnpm/store/v3/files/foo"]
should_not_match = ["~/.cargo", "~/Library/pnpm/global/5/node_modules/typescript/package.json"]
