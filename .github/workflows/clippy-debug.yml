# TEMPORARY debugging workflow — deleted once the clippy findings are fixed.
#
# CI logs live on Azure Blob, which is unreachable from the agent sandbox, so
# `gh run view --log` cannot show why the clippy gate failed. This job re-runs
# the same command and re-emits the output as check annotations, which ARE
# readable through the GitHub API.
name: Clippy debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy output as annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk-bridge2.0-dev libatk1.0-dev libcups2-dev libgdk-pixbuf-2.0-dev \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxkbcommon-dev libxcb1-dev libxrandr-dev libxi-dev
      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Run Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        id: clippy
        continue-on-error: true
        # `--message-format=short` puts file:line:col on every diagnostic line,
        # so each finding is self-contained once the progress noise is dropped.
        run: cargo clippy --workspace --all-targets --all-features --message-format=short -- -D warnings 2>&1 | tee clippy.log

      - name: Emit output as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import re

          try:
              text = open("clippy.log", encoding="utf-8", errors="replace").read()
          except OSError:
              text = "(no clippy.log produced)"

          text = re.sub(r"\x1b\[[0-9;]*m", "", text)
          keep = [
              line.rstrip()
              for line in text.splitlines()
              if re.search(r"(error|warning)(\[|:)", line)
          ]
          if not keep:
              keep = ["(clippy produced no error/warning lines)"]

          # Annotations cannot contain raw newlines.
          flat = "\n".join(keep).replace("%", "%25").replace("\r", "").replace("\n", " ~ ")
          chunk = 2800
          total = (len(flat) + chunk - 1) // chunk
          for index in range(min(total, 20)):
              piece = flat[index * chunk : (index + 1) * chunk]
              print(f"::error title=clippy-{index + 1}::{piece}")
          PY
