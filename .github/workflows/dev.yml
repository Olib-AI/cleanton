# ============================================================================
# Cleanton — Dev gate ("second PC")
# ============================================================================
# The sandbox that authored this branch has no Rust toolchain and cannot reach
# static.rust-lang.org / crates.io, so `cargo` cannot run locally. GitHub
# Actions is the build machine: this workflow (plus `ci.yml` and `security.yml`)
# is the lint/test/build/audit "second PC".
#
# Triggering it
# -------------
#   gh workflow run dev.yml --ref arena/<branch>      # manual, runs everything
#   scripts/dev-ci.sh trigger                         # same, plus prints the run
#   scripts/dev-ci.sh watch <run-id>                  # block until it finishes
#   scripts/dev-ci.sh report <run-id>                 # per-job status
#   scripts/dev-ci.sh logs <run-id> [job-name-glob]   # dump logs
#
# On a pull request this workflow runs only the cheap recipe/doc gate (the
# full Rust matrix lives in `ci.yml`, which already fires on PRs to main). A
# manual `workflow_dispatch` runs the complete gate: recipes, fmt, clippy,
# tests on macOS + Ubuntu, and `cargo audit`.
#
# Test output is uploaded as an artifact so a failure can be read without
# digging through the runner log; `scripts/dev-ci.sh logs` reads it back.

name: Dev gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
      - "doc/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "crates/cleanton-recipes/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: Recipe registry + builtin registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate recipes (offline structural gate)
        run: python3 scripts/validate-recipes.py

      - name: Upload recipe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-report
          path: recipes/*.toml
          if-no-files-found: ignore

  rust:
    name: Rust gates (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev pkg-config

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify toolchain pin
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ]

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (tee full log)
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          if-no-files-found: ignore

  audit:
    name: cargo audit
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit (policy from .cargo/audit.toml)
        run: cargo audit --deny unsound

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: |
            test-output.txt
          if-no-files-found: ignore

  summary:
    name: Summary
    if: github.event_name == 'workflow_dispatch'
    needs: [recipes, rust, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write run summary
        run: |
          {
            echo "## Dev gate summary"
            echo
            echo "- workflow: ${{ github.workflow }}"
            echo "- ref: ${{ github.ref }}"
            echo "- sha: ${{ github.sha }}"
            echo "- recipes job: ${{ needs.recipes.result }}"
            for os in macos-14 ubuntu-latest; do
              echo "- rust($os): ${{ needs.rust.result }}"
            done
            echo "- audit: ${{ needs.audit.result }}"
          } > dev-gate-summary.txt
          cat dev-gate-summary.txt

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-gate-summary
          path: dev-gate-summary.txt
          if-no-files-found: ignore
