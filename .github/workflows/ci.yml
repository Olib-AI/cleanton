name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  rust:
    name: Rust gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify toolchain pin
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ]

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  macos-build:
    name: macOS unsigned release build
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p cleanton-cli -p cleanton-app

      - name: Package unsigned local artifacts
        run: ./packaging/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cleanton-macos-unsigned-${{ runner.arch }}
          path: packaging/dist/
          if-no-files-found: error
