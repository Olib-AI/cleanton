# ============================================================================
# Agent gate (TEMPORARY — remove before merge)
# ============================================================================
# The authoring sandbox has no Rust toolchain and cannot read Actions job logs
# (only api.github.com is reachable). This workflow:
#
#   1. formats the workspace and commits the result back to the branch, so
#      `cargo fmt --all --check` in ci.yml passes without a local toolchain;
#   2. surfaces compiler/clippy/test diagnostics as check-run ANNOTATIONS, which
#      *are* readable through the API (`/check-runs/{id}/annotations`).
#
# It is a development aid only and is deleted once the branch is green.

name: Agent gate

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  fmt-fix:
    name: Format and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all

      - name: Commit formatting (if any)
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "Agent Gate"
          git config user.email "agent-gate@users.noreply.github.com"
          git add -A
          git commit -m "chore(fmt): cargo fmt [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

  rust-check:
    name: Clippy and tests (annotated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libfontconfig1-dev pkg-config

      - name: Install Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "clippy exited $status"
            grep -n -E "^(error|warning)(\[|:)" clippy.log | head -40 | while IFS= read -r line; do
              echo "::error title=clippy::$line"
            done
            tail -40 clippy.log | while IFS= read -r line; do
              echo "::error title=clippy-tail::$line"
            done
          fi
          exit $status

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --no-fail-fast > tests.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "tests exited $status"
            grep -E "^(error|warning)(\[|:)|^test .* FAILED|^---- .* stdout ----|panicked at" tests.log | head -40 | while IFS= read -r line; do
              echo "::error title=test::$line"
            done
            tail -60 tests.log | while IFS= read -r line; do
              echo "::error title=test-tail::$line"
            done
          fi
          exit $status
